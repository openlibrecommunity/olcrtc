# Client config: wbstream + seichannel
# Run: olcrtc docs/examples/client/client.wbstream.seichannel.yaml

mode: cnc # role: srv (server) or cnc (client)

auth:
  provider: wbstream # call service provider used for signaling

# For wbstream: Room ID returned by the service.
# Must match the server.
room:
  id: "REPLACE_WITH_WB_ROOM_ID" # room id

crypto:
  # You can use key_file: "./olcrtc.key" to avoid storing the secret here.
  key: "REPLACE_ME_WITH_64_HEX_CHARS" # must match the server

net:
  transport: seichannel # transport to use, e.g. datachannel
  dns: "8.8.8.8:53" # dns used to resolve names

liveness:
  interval: 10s # how often to send liveness checks
  timeout: 5s # wait time for a liveness reply
  failures: 3 # consecutive failures before the link is considered dead

socks: # local socks proxy exposed to apps
  host: "127.0.0.1" # address to listen on
  port: 8808 # port to listen on
  user: "" # optional inbound auth
  pass: "" # optional inbound auth

sei:
  fps: 30 # frames per second
  batch_size: 64 # messages packed per batch
  fragment_size: 900 # max payload bytes per fragment
  ack_timeout_ms: 2000 # ack wait before retransmit (ms)

data: data # where to store / read data
debug: false # log actions in more detail
