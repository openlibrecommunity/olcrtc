# Server config: jitsi + videochannel
# Run: olcrtc docs/examples/server/server.jitsi.videochannel.yaml

mode: srv # role: srv (server) or cnc (client)

auth:
  provider: jitsi # call service provider used for signaling

# For jitsi: full room URL (https://host/room or host/room).
# Must match the client.
# Instances: see docs/examples/jitsi.instances.yaml
# Check in a browser which one works in your network.
room:
  id: "https://meet.example.org/REPLACE_WITH_ROOM_NAME" # room name / URL

crypto:
  # 32 bytes in hex (64 chars). Generate: openssl rand -hex 32
  # You can use key_file: "./olcrtc.key" to avoid storing the secret here.
  key: "REPLACE_ME_WITH_64_HEX_CHARS" # must match the client

net:
  transport: videochannel # transport to use, e.g. datachannel
  dns: "8.8.8.8:53" # dns used to resolve names

liveness:
  interval: 10s # how often to send liveness checks
  timeout: 5s # wait time for a liveness reply
  failures: 3 # consecutive failures before the link is considered dead

socks: # upstream socks proxy
  proxy_addr: "" # e.g. "127.0.0.1"
  proxy_port: 0 # e.g. 1080
  proxy_user: "" # optional auth for upstream proxy (RFC 1929)
  proxy_pass: "" # optional auth for upstream proxy (RFC 1929)

video:
  width: 1920 # frame width in pixels
  height: 1080 # frame height in pixels
  fps: 30 # frames per second
  bitrate: "2M" # target video bitrate
  hw: none # hardware acceleration (none, or vendor codec)
  codec: qrcode # payload encoding used inside the video
  qr_size: 0 # qr module size in px (0 = auto)
  qr_recovery: low # qr error correction level (low/medium/high)
  tile_module: 4 # data tile module size
  tile_rs: 20 # reed-solomon parity per tile
ffmpeg: ffmpeg # ffmpeg binary path or name

data: data # where to store / read data
debug: false # log actions in more detail
